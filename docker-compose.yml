services:
  postgres:
    image: postgres:16
    container_name: swag-postgres
    environment:
      POSTGRES_DB: swag
      POSTGRES_USER: swag
      POSTGRES_PASSWORD: swag_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swag -d swag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
