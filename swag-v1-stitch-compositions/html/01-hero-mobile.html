<!-- Interactive Script for micro-parallax and nav logic -->
<script>
        document.addEventListener('mousemove', (e) => {
            const ghost = document.querySelector('.font-display-bleed');
            const x = (window.innerWidth / 2 - e.pageX) / 50;
            const y = (window.innerHeight / 2 - e.pageY) / 50;
            ghost.style.transform = `translate(${x}px, ${y}px) rotate(-90deg)`;
        });

        // Simple visibility toggle for SideNav (would be triggered by a menu icon usually)
        // For this prototype, we maintain the hero-only focus as requested.
    </script>
