<style>
        body {
            background-color: #575D61; /* Stone Grey */
            color: #D6D1C4; /* Sand */
            overflow-x: hidden;
            margin: 0;
            cursor: crosshair;
        }
        .text-sand { color: #D6D1C4; }
        .bg-stone { background-color: #575D61; }
        .ghost-bleed {
            font-size: 18vw;
            opacity: 0.05;
            white-space: nowrap;
            pointer-events: none;
            z-index: 0;
        }
        .watermark-layer {
            opacity: 0.02;
            pointer-events: none;
            line-height: 0.8;
            z-index: -1;
        }
        .parallax-container {
            perspective: 1000px;
        }
        .fade-in {
            animation: fadeIn 2s cubic-bezier(0.2, 0, 0.2, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .reveal-delay-1 { animation-delay: 0.2s; }
        .reveal-delay-2 { animation-delay: 0.4s; }
        .reveal-delay-3 { animation-delay: 0.6s; }
    </style>
</head>
<body class="font-body-manifesto selection:bg-muted-sand selection:text-stone-grey">
<!-- Top AppBar Component -->
<header class="fixed top-0 w-full z-50 flex justify-between items-end px-margin-safe py-8 w-full bg-transparent no-border flat no shadows">
<div class="font-display-bleed text-display-bleed lowercase tracking-tighter text-on-background dark:text-on-background cursor-pointer transition-all duration-700 ease-in-out">
            swag.
        </div>
<nav class="flex gap-8">
<a class="font-label-mono text-label-mono uppercase text-stone-grey hover:text-on-background transition-colors duration-500 cursor-pointer" href="#">
                WEARABLE EDITIONS
            </a>
<a class="font-label-mono text-label-mono uppercase text-stone-grey hover:text-on-background transition-colors duration-500 cursor-pointer" href="#">
                @crosswithswag
            </a>
</nav>
</header>
<!-- Side Navigation Trigger (Abstracted) -->
<div class="fixed left-margin-safe bottom-8 z-50">
<div class="flex flex-col space-y-2 opacity-40 hover:opacity-100 transition-opacity duration-500">
<span class="font-label-mono text-[10px] tracking-widest uppercase">Navigation</span>
<div class="w-8 h-[1px] bg-muted-sand"></div>
</div>
</div>
<!-- Main Canvas -->
<main class="relative min-h-screen w-full flex flex-col justify-center px-margin-safe overflow-hidden">
<!-- Ghost Watermark Background Layer -->
<div class="absolute inset-0 flex items-center justify-center watermark-layer select-none">
<div class="font-display-bleed text-display-bleed flex flex-col items-center tracking-tighter leading-none">
<span>CROSS</span>
<span>WITH</span>
<span>SWAG</span>
</div>
</div>
<!-- Ghost Bleed Text -->
<div class="absolute -bottom-10 right-[-5vw] ghost-bleed font-display-bleed select-none">
            PRESENCE
        </div>
<!-- Foreground Content -->
<div class="relative z-10 max-w-4xl space-y-24">
<!-- Top-left label -->
<div class="fade-in">
<span class="text-[0.65rem] tracking-[0.2em] font-label-mono text-muted-sand opacity-60 uppercase block mb-12">
                    WHAT IS SWAG?
                </span>
</div>
<!-- Statement Modules -->
<div class="space-y-16">
<div class="fade-in reveal-delay-1">
<h2 class="font-statement text-statement text-muted-sand uppercase max-w-2xl">
                        EMANATES PRESENCE
                    </h2>
</div>
<div class="fade-in reveal-delay-2">
<h2 class="font-statement text-statement text-muted-sand uppercase max-w-2xl ml-[10vw]">
                        DOES NOT BEG TO BE UNDERSTOOD
                    </h2>
</div>
<div class="fade-in reveal-delay-3">
<h2 class="font-statement text-statement text-muted-sand uppercase max-w-2xl ml-[5vw]">
                        COMMANDS RESPECT WITHOUT RAISING A VOICE
                    </h2>
</div>
</div>
</div>
<!-- Atmosphere Subtle Grid/Texture (CSS Only) -->
<div class="absolute inset-0 pointer-events-none opacity-20" style="background-image: radial-gradient(#D6D1C4 0.5px, transparent 0.5px); background-size: 40px 40px;"></div>
</main>
<!-- Footer Component -->
<footer class="w-full py-12 flex flex-col md:flex-row justify-between items-center px-margin-safe w-full gap-4 bg-transparent no-border">
<div class="font-display-bleed text-display-bleed opacity-10 select-none">
            swag.
        </div>
<div class="flex gap-8 font-label-mono text-label-mono text-stone-grey">
<span class="text-stone-grey">© 2024 SWAG. EDITIONS</span>
<a class="hover:text-on-background underline transition-all duration-300" href="#">TERMS</a>
<a class="hover:text-on-background underline transition-all duration-300" href="#">PRIVACY</a>
<a class="text-on-background transition-all duration-300" href="#">@crosswithswag</a>
</div>
</footer>
<!-- Script for subtle parallax and micro-interactions -->
<script>
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;
            
            const ghost = document.querySelector('.ghost-bleed');
            const watermark = document.querySelector('.watermark-layer');
            
            if (ghost) {
                ghost.style.transform = `translate(${x * 30}px, ${y * 30}px)`;
            }
            if (watermark) {
                watermark.style.transform = `translate(${x * -15}px, ${y * -15}px)`;
            }
        });

        // Interactive "Stone" weight - slow reveal on scroll
        const observerOptions = {
            threshold: 0.1
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('fade-in');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.font-statement').forEach(el => observer.observe(el));
    </script>
