<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #0A0A0A;
            margin: 0;
            overflow-x: hidden;
        }
        /* Custom scroll behavior for the gallery feel */
        ::-webkit-scrollbar {
            display: none;
        }
        .bleed-text {
            white-space: nowrap;
            user-select: none;
            pointer-events: none;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "stone-grey": "#575D61",
                      "on-secondary-fixed-variant": "#49473d",
                      "on-tertiary-container": "#747a7e",
                      "muted-sand": "#D6D1C4",
                      "on-secondary-container": "#b9b5a8",
                      "on-primary-fixed-variant": "#474646",
                      "background": "#131313",
                      "primary-fixed": "#e5e2e1",
                      "surface-container-low": "#1c1b1b",
                      "error-container": "#93000a",
                      "outline": "#8e9192",
                      "surface-container-high": "#2a2a2a",
                      "primary": "#c9c6c5",
                      "tertiary": "#c2c7cc",
                      "tertiary-container": "#060b0e",
                      "secondary": "#cbc6b9",
                      "error": "#ffb4ab",
                      "on-error": "#690005",
                      "secondary-container": "#49473d",
                      "surface-bright": "#3a3939",
                      "on-secondary-fixed": "#1d1c14",
                      "surface": "#131313",
                      "void-black": "#0A0A0A",
                      "surface-container-highest": "#353534",
                      "on-secondary": "#323028",
                      "on-tertiary-fixed-variant": "#42484b",
                      "tertiary-fixed-dim": "#c2c7cc",
                      "secondary-fixed": "#e7e2d5",
                      "deep-earth-clay": "#8C5E4A",
                      "inverse-primary": "#5f5e5e",
                      "surface-variant": "#353534",
                      "on-primary": "#313030",
                      "on-tertiary": "#2b3135",
                      "on-background": "#e5e2e1",
                      "secondary-fixed-dim": "#cbc6b9",
                      "on-surface": "#e5e2e1",
                      "surface-container-lowest": "#0e0e0e",
                      "surface-container": "#201f1f",
                      "tertiary-fixed": "#dee3e8",
                      "on-tertiary-fixed": "#161c20",
                      "primary-fixed-dim": "#c9c6c5",
                      "on-surface-variant": "#c4c7c7",
                      "surface-tint": "#c9c6c5",
                      "inverse-on-surface": "#313030",
                      "on-primary-fixed": "#1c1b1b",
                      "inverse-surface": "#e5e2e1",
                      "primary-container": "#0a0a0a",
                      "outline-variant": "#444748",
                      "on-error-container": "#ffdad6",
                      "surface-dim": "#131313",
                      "on-primary-container": "#7b7979"
              },
              "spacing": {
                      "poster-padding": "10dvh",
                      "gutter": "1rem",
                      "ghost-offset": "-2vw",
                      "margin-safe": "clamp(2rem, 5vw, 6rem)"
              },
              "fontFamily": {
                      "label-mono": ["Instrument Sans"],
                      "headline-poster": ["Instrument Sans"],
                      "body-manifesto": ["Instrument Sans"],
                      "statement": ["Instrument Sans"],
                      "display-bleed": ["Instrument Sans"]
              },
              "fontSize": {
                      "label-mono": ["clamp(11px, 1vw, 13px)", {"lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "400"}],
                      "headline-poster": ["clamp(40px, 7vw, 96px)", {"lineHeight": "1.0", "letterSpacing": "-0.04em", "fontWeight": "700"}],
                      "body-manifesto": ["clamp(16px, 1.5vw, 20px)", {"lineHeight": "1.6", "letterSpacing": "0em", "fontWeight": "400"}],
                      "statement": ["clamp(24px, 4vw, 56px)", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "500"}],
                      "display-bleed": ["clamp(80px, 16vw, 220px)", {"lineHeight": "0.9", "letterSpacing": "-0.06em", "fontWeight": "700"}]
              }
            },
          },
        }
      </script>
</head>
<body class="bg-void-black text-on-surface font-body-manifesto selection:bg-muted-sand selection:text-void-black">
<!-- Top Navigation Shell (Fixed per Shared Components) -->
<nav class="fixed top-0 w-full flex justify-between items-end px-margin-safe py-8 w-full z-50 bg-transparent no-border flat no shadows">
<div class="flex flex-col gap-1 items-start">
<span class="font-display-bleed text-display-bleed lowercase tracking-tighter text-muted-sand leading-none" style="font-size: clamp(24px, 5vw, 48px);">
                swag.
            </span>
<span class="font-label-mono text-label-mono uppercase text-muted-sand tracking-[0.15em]" style="font-size: 14px;">
                WEARABLE EDITIONS
            </span>
</div>
<div class="hidden md:flex gap-12 items-center">
<a class="font-label-mono text-label-mono uppercase cursor-pointer transition-all duration-700 ease-in-out hover:text-on-background transition-colors duration-500 text-on-background border-b border-on-background" href="#">
                WEARABLE EDITIONS
            </a>
<a class="font-label-mono text-label-mono uppercase cursor-pointer transition-all duration-700 ease-in-out hover:text-on-background transition-colors duration-500 text-stone-grey" href="#">
                @crosswithswag
            </a>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="relative min-h-[1024px] w-full flex flex-col overflow-hidden">
<!-- Ghost Watermark Layer (Background Atmospheric Type) -->
<div class="absolute inset-0 z-0 flex flex-col justify-center pointer-events-none overflow-hidden mix-blend-screen opacity-5">
<div class="bleed-text font-display-bleed font-bold text-muted-sand leading-[0.8] translate-x-[-5vw]">
                NOTH-
            </div>
<div class="bleed-text font-display-bleed font-bold text-muted-sand leading-[0.8] translate-x-[15vw]">
                OWE
            </div>
<div class="bleed-text font-display-bleed font-bold text-muted-sand leading-[0.8] translate-x-[-10vw]">
                ING.
            </div>
</div>
<!-- Foreground Content (Asymmetric Poster Composition) -->
<section class="relative z-10 flex flex-col justify-end min-h-[1024px] px-margin-safe pb-24">
<div class="max-w-[80vw] md:max-w-[60vw]">
<!-- Intentionally left focused on the typographic atmosphere per prompt requirements -->
</div>
</section>
</main>
<!-- Side Navigation Menu (Triggered Interaction Example) -->
<div class="fixed inset-y-0 left-0 w-screen md:w-1/3 bg-surface-container-lowest z-[100] translate-x-[-100%] transition-transform duration-1000 ease-in-out flex flex-col justify-center px-margin-safe h-full space-y-12 no-border" id="sideNav">
<div class="absolute top-8 left-margin-safe flex flex-col">
<span class="font-display-bleed text-display-bleed text-on-surface">swag.</span>
<span class="font-label-mono text-label-mono text-stone-grey tracking-[0.15em] uppercase">WEARABLE EDITIONS</span>
</div>
<button class="absolute top-10 right-8 text-on-surface cursor-pointer" onclick="toggleNav()">
<span class="material-symbols-outlined text-4xl">close</span>
</button>
<nav class="flex flex-col space-y-8">
<a class="font-statement text-statement uppercase text-on-surface font-bold tracking-widest flex items-center gap-4 group" href="#">
<span class="material-symbols-outlined opacity-0 group-hover:opacity-100 transition-opacity">menu_book</span>
                EDITIONS
            </a>
<a class="font-statement text-statement uppercase text-stone-grey hover:text-on-surface underline decoration-1 underline-offset-8 transition-all duration-500 flex items-center gap-4 group" href="#">
<span class="material-symbols-outlined opacity-0 group-hover:opacity-100 transition-opacity">history</span>
                ARCHIVE
            </a>
<a class="font-statement text-statement uppercase text-stone-grey hover:text-on-surface underline decoration-1 underline-offset-8 transition-all duration-500 flex items-center gap-4 group" href="#">
<span class="material-symbols-outlined opacity-0 group-hover:opacity-100 transition-opacity">article</span>
                MANIFESTO
            </a>
<a class="font-statement text-statement uppercase text-stone-grey hover:text-on-surface underline decoration-1 underline-offset-8 transition-all duration-500 flex items-center gap-4 group" href="#">
<span class="material-symbols-outlined opacity-0 group-hover:opacity-100 transition-opacity">alternate_email</span>
                CONNECT
            </a>
</nav>
</div>
<!-- Hidden Trigger for Demo Purposes -->
<div class="fixed bottom-12 left-margin-safe z-50">
<button class="group flex items-center gap-4 text-stone-grey hover:text-on-surface transition-colors duration-500" onclick="toggleNav()">
<span class="font-label-mono text-label-mono uppercase tracking-widest">Index</span>
<span class="material-symbols-outlined text-2xl">menu</span>
</button>
</div>
<!-- Footer Shell -->
<footer class="w-full py-12 flex flex-col md:flex-row justify-between items-center px-margin-safe w-full gap-4 z-40 bg-transparent no-border">
<div class="font-display-bleed text-display-bleed opacity-10 text-on-surface scale-50 origin-left">
            swag.
        </div>
<div class="flex flex-col md:flex-row items-center gap-8">
<div class="font-label-mono text-label-mono text-stone-grey uppercase">
                © 2024 SWAG. EDITIONS
            </div>
<div class="flex gap-6">
<a class="font-label-mono text-label-mono text-stone-grey hover:text-on-background underline transition-all duration-300" href="#">@crosswithswag</a>
<a class="font-label-mono text-label-mono text-stone-grey hover:text-on-background underline transition-all duration-300 uppercase" href="#">Terms</a>
<a class="font-label-mono text-label-mono text-stone-grey hover:text-on-background underline transition-all duration-300 uppercase" href="#">Privacy</a>
</div>
</div>
</footer>
<script>
        function toggleNav() {
            const nav = document.getElementById('sideNav');
            const isHidden = nav.style.transform === 'translateX(-100%)' || nav.style.transform === '';
            nav.style.transform = isHidden ? 'translateX(0%)' : 'translateX(-100%)';
        }

        // Subtle parallax effect for ghost text
        window.addEventListener('scroll', () => {
            const scrolled = window.pageYOffset;
            const ghostLines = document.querySelectorAll('.bleed-text');
            ghostLines.forEach((line, index) => {
                const speed = (index + 1) * 0.2;
                line.style.transform = `translateX(${(index % 2 === 0 ? -1 : 1) * 5 + (scrolled * speed)}px)`;
            });
        });
    </script>
</body></html>
