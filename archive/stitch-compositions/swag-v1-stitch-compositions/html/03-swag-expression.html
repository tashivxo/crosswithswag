<style>

        }

        .reveal-module.active {

<script>
        // Reveal content on load
        window.addEventListener('DOMContentLoaded', () => {
            const modules = document.querySelectorAll('.reveal-module');
            modules.forEach(m => m.classList.add('active'));
        });

        // Simple parallax logic for background text
        window.addEventListener('scroll', () => {
            const scroll = window.pageYOffset;
            const ghostLayers = document.querySelectorAll('.ghost-layer');
            ghostLayers.forEach(layer => {
                const speed = layer.getAttribute('data-speed') || 0.2;
                layer.style.transform = `translateY(${scroll * speed}px)`;
            });
        });

        function toggleNav() {
            const nav = document.getElementById('side-nav');
            if (nav.style.transform === 'translateX(0%)') {
                nav.style.transform = 'translateX(-100%)';
            } else {
                nav.style.transform = 'translateX(0%)';
            }
        }

        // Micro-interaction for statement modules
        document.querySelectorAll('.font-statement').forEach(el => {
            el.addEventListener('mouseenter', () => {
                el.style.transition = 'letter-spacing 0.8s cubic-bezier(0.23, 1, 0.32, 1)';
                el.style.letterSpacing = '0.05em';
            });
            el.addEventListener('mouseleave', () => {
                el.style.letterSpacing = '-0.02em';
            });
        });
    </script>
