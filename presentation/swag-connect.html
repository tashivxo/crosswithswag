<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0A">
<title>swag. — connect</title>
<meta name="description" content="swag. — instagram, whatsapp, facebook, and the site.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --void: #0A0A0A;
  --stone: #575D61;
  --clay: #8C5E4A;
  --sand: #D6D1C4;
  --line: rgba(214, 209, 196, 0.14);
  --gut: clamp(24px, 6vw, 72px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--void);
  color: var(--sand);
  font-family: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 1px solid var(--clay); outline-offset: 4px; }
::selection { background: var(--clay); color: var(--sand); }

.shell {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: clamp(48px, 12vh, 120px) var(--gut);
  max-width: 720px;
  margin-inline: auto;
  width: 100%;
}

.mark {
  font-weight: 700;
  font-size: clamp(42px, 12vw, 88px);
  letter-spacing: 0.02em;
  text-transform: lowercase;
  line-height: 0.95;
}

.lbl {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.17em;
  text-transform: uppercase;
  color: var(--stone);
  margin-top: clamp(28px, 5vh, 48px);
}

.headline {
  margin-top: 12px;
  font-weight: 700;
  font-size: clamp(22px, 5vw, 36px);
  letter-spacing: -0.03em;
  text-transform: uppercase;
  line-height: 1.05;
  max-width: 14ch;
}

.links {
  margin-top: clamp(40px, 8vh, 72px);
  list-style: none;
  border-top: 1px solid var(--line);
}

.links li {
  border-bottom: 1px solid var(--line);
}

.links a {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  padding: clamp(18px, 3vh, 28px) 0;
  transition: color 0.25s ease;
}

.links a:hover,
.links a:focus-visible {
  color: var(--clay);
}

.links .name {
  font-weight: 500;
  font-size: clamp(17px, 2.4vw, 22px);
  letter-spacing: -0.01em;
}

.links .go {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--stone);
  flex-shrink: 0;
  transition: color 0.25s ease;
}

.links a:hover .go,
.links a:focus-visible .go {
  color: var(--clay);
}

.foot {
  margin-top: clamp(48px, 10vh, 96px);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--stone);
}

@media (prefers-reduced-motion: reduce) {
  .links a,
  .links .go { transition: none; }
}
</style>
</head>
<body>
<main class="shell">
  <div>
    <p class="mark" aria-hidden="true">swag.</p>
    <p class="lbl">[ wearable editions ]</p>
    <h1 class="headline">Find us<br>online.</h1>
    <ul class="links">
      <li>
        <a href="https://crosswithswag.co.za/" target="_blank" rel="noopener noreferrer">
          <span class="name">Website</span>
          <span class="go">crosswithswag.co.za →</span>
        </a>
      </li>
      <li>
        <a href="https://www.instagram.com/crosswithswag/" target="_blank" rel="noopener noreferrer">
          <span class="name">Instagram</span>
          <span class="go">@crosswithswag →</span>
        </a>
      </li>
      <li>
        <a href="https://wa.me/27682812891?text=Hi%20%E2%80%94%20connecting%20from%20swag." target="_blank" rel="noopener noreferrer">
          <span class="name">WhatsApp</span>
          <span class="go">+27 68 281 2891 →</span>
        </a>
      </li>
      <li>
        <a href="https://www.facebook.com/people/crosswithswag/61594135325116/" target="_blank" rel="noopener noreferrer">
          <span class="name">Facebook</span>
          <span class="go">crosswithswag →</span>
        </a>
      </li>
    </ul>
  </div>
  <p class="foot">cape town — 2026</p>
</main>
</body>
</html>
